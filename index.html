<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#E84142" />
    <meta name="description" content="Avalanche Pay - Billetera Web y Android para Pagos Offline en Avalanche C-Chain con Árbol de Merkle y Sincronización Automática" />
    <link rel="manifest" href="/manifest.json" />
    <title>Avalanche • Offline P2P Web3 Wallet</title>
    <!-- Load Go WebAssembly runtime support -->
    <script src="/wasm_exec.js"></script>
    <script>
      // Register Service Worker for 100% offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[Avalanche PWA] Service Worker registrado:', reg.scope);
          }).catch((err) => {
            console.warn('[Avalanche PWA] Fallo de registro de Service Worker:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
